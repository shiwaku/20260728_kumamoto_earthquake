name: Deploy viewer to GitHub Pages

on:
  push:
    branches: [main]
    # 巡回ワークフロー（watch-gsi.yml）が main に置くスナップショットはビューワの成果物に
    # 影響しない。これを無視しないと、更新検知のたびに無意味な再デプロイが走る。
    paths-ignore:
      - 'watch/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時実行は最新のみ。進行中のデプロイはキャンセルせず完了させる。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viewer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - run: npm ci
      - run: npm run build
      # enablement: true にしておくと、リポジトリ側で Pages を有効化する前に
      # ワークフローが走っても「Get Pages site failed」で落ちずに自分で有効化する。
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: viewer/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
