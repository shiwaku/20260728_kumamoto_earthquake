name: Watch GSI page

# 国土地理院の令和8年熊本地震ページを定期巡回し、更新・追加があれば Issue を立てる。
#
# なぜ cron なのか
#   配信元は Last-Modified を返さないので、内容を取り込んで前回と比べる以外に更新を知る術がない。
#   配信元の公表は平日日中に日1〜2回なので、1日1回・朝の巡回で前日分をまとめて拾える。
#   分を :00 ちょうどから外しているのは、GitHub 側の混雑時刻を避けて実行の遅延を減らすため。
#
# 何をするのか
#   1. tools/watch_gsi.py が配信元を巡回して watch/gsi_snapshot.json を更新する
#   2. 差分があれば Issue を立て、スナップショットを main にコミットする
#   3. 実際のレイヤー追加作業（layers.ts の編集）は Issue を見て人が行う
#
# 差分の中身はスナップショットの git diff でも読める。本文テキストを行単位で保存しているので、
# コミット差分がそのまま「配信元のどの一文が増えたか」になる。

on:
  schedule:
    - cron: '7 22 * * *' # UTC。JST では毎朝 7:07
  workflow_dispatch:
    inputs:
      audit_only:
        description: 'スナップショットを更新せず、未収録タイルの棚卸しだけ表示する'
        type: boolean
        default: false

permissions:
  contents: write # スナップショットを main にコミットする
  issues: write # 更新検知時に Issue を立てる

# 巡回は重ねない。走っている間に次の cron が来たら、そちらを待たせる。
concurrency:
  group: watch-gsi
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 棚卸しのみ（手動実行時）
        if: inputs.audit_only
        run: python3 tools/watch_gsi.py --audit

      - name: 配信元を巡回して差分を取る
        if: ${{ !inputs.audit_only }}
        id: watch
        run: |
          python3 tools/watch_gsi.py \
            --update \
            --report "$RUNNER_TEMP/report.md" \
            --github-output "$GITHUB_OUTPUT"

      # コミットより先に立てる。main が保護されていてプッシュが弾かれた場合でも、
      # 検知したことだけは必ず手元に届くようにしたい。
      - name: Issue を立てる
        if: ${{ !inputs.audit_only && steps.watch.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SUMMARY: ${{ steps.watch.outputs.summary }}
        run: |
          # ラベルは初回だけ作る。既にあれば黙って通す。
          gh label create gsi-update --color BFD4F2 --description '配信元ページの更新検知' 2>/dev/null || true
          {
            echo "配信元ページに変更を検知しました。対応が必要なものがあれば、このIssueを起点にブランチを切ってください。"
            echo
            cat "$RUNNER_TEMP/report.md"
            echo
            echo "スナップショットの差分（どの一文が変わったか）: ${{ github.server_url }}/${{ github.repository }}/commits/main/watch/gsi_snapshot.json"
            echo
            echo "検知した実行: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > "$RUNNER_TEMP/issue.md"
          url=$(gh issue create \
            --title "配信元更新: $SUMMARY ($(TZ=Asia/Tokyo date +%Y-%m-%d))" \
            --label gsi-update \
            --body-file "$RUNNER_TEMP/issue.md")
          echo "$url"

          # 番号が決まってから閉じ方を書き足す。コピーして貼れる `Closes #N` がその場に無いと、
          # 素の参照だけ書いて閉じ忘れる（PR #11 と Issue #10 で実際にそうなった）。
          number=${url##*/}
          {
            echo
            echo '---'
            echo "対応したら、PR本文に \`Closes #$number\` と書く。マージ時にこのIssueは自動で閉じる。"
            echo "素の \`#$number\` 参照でも close-gsi-issue.yml が拾って閉じる。"
            echo '対応不要と判断した場合は、その理由をコメントして閉じる。'
            echo '3日以上開いたままだと、毎朝の巡回がこのIssueに声をかける。'
          } >> "$RUNNER_TEMP/issue.md"
          gh issue edit "$number" --body-file "$RUNNER_TEMP/issue.md"

      - name: スナップショットをコミット
        if: ${{ !inputs.audit_only && steps.watch.outputs.changed == 'true' }}
        env:
          # 配信元由来の文字列なので、シェルに直接展開せず環境変数で渡す
          SUMMARY: ${{ steps.watch.outputs.summary }}
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add watch/gsi_snapshot.json
          git commit -m "chore(watch): 国土地理院ページのスナップショットを更新" -m "$SUMMARY"
          # 直前に人手のコミットが入っていても落ちないように追いつく
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - name: 変更なし
        if: ${{ !inputs.audit_only && steps.watch.outputs.changed != 'true' }}
        run: echo '配信元に変更なし。'

      # 検知は自動だが、閉じるのは人の判断（対応した／対応不要）なので放っておくと溜まる。
      # 差分がない日も走らせて、開いたままの検知 Issue に声をかける。
      # コミットのプッシュが弾かれても声かけは通したいので !cancelled() で回す。
      - name: 開いたままの検知 Issue に声をかける
        if: ${{ !cancelled() && !inputs.audit_only }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          STALE_DAYS=3 # これだけ開いていたら声をかける
          RENOTIFY_DAYS=7 # 同じ Issue への次の声かけまで待つ日数
          # 自分の声かけを見分ける目印。HTML コメントなので Issue 上には表示されない。
          MARKER='<!-- gsi-update-stale-reminder -->'

          now=$(date -u +%s)
          open=$(gh issue list --label gsi-update --state open --limit 50 \
            --json number,createdAt --jq '.[] | "\(.number) \(.createdAt)"')

          if [ -z "$open" ]; then
            echo '開いている検知 Issue はない。'
            exit 0
          fi

          while read -r number created; do
            [ -n "$number" ] || continue
            age=$(( (now - $(date -u -d "$created" +%s)) / 86400 ))
            if [ "$age" -lt "$STALE_DAYS" ]; then
              echo "#$number: $age 日。まだ声をかけない"
              continue
            fi
            # 前回の声かけからの経過で黙るかを決める。毎朝コメントしたら通知が意味を失う。
            last=$(gh issue view "$number" --json comments \
              | jq -r --arg m "$MARKER" '[.comments[] | select(.body | contains($m)) | .createdAt] | max // empty')
            if [ -n "$last" ]; then
              since=$(( (now - $(date -u -d "$last" +%s)) / 86400 ))
              if [ "$since" -lt "$RENOTIFY_DAYS" ]; then
                echo "#$number: $since 日前に声をかけたので黙る"
                continue
              fi
            fi
            gh issue comment "$number" --body "$MARKER
          この検知 Issue は $age 日開いたままです。

          - レイヤーの追加・差し替えが要るなら、このIssueを起点にブランチを切る（PR本文に \`Closes #$number\` と書けばマージで閉じる）
          - 配信元の体裁変更などで対応不要なら、理由をコメントして閉じる

          （$RENOTIFY_DAYS 日おきに声をかけます）"
            echo "#$number: 声をかけた（$age 日）"
          done <<< "$open"
